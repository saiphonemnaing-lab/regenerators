[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-station-selection"
version = "0.1.0"
description = "Select the most suitable CIMIS or in-orchard weather stations for chill and GDD monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
select-stations = "station_selection.cli:main"

[tool.setuptools]
packages = ["station_selection"]
